<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Country Search Website</title>
  </head>

  <body>
    <div class="content">
      <h1>Country Search</h1>
      <div class="searchBox">
        <label for="countryInput">Country name</label>
        <input
          id="countryInput"
          type="text"
          placeholder="Search for a country..."
        />
        <button id="searchBtn">Search</button>
      </div>
    </div>
    <div id="countryResult" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
